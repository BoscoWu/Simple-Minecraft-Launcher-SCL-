name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ---------- Windows：.exe 安装包 ----------
      - name: Install WiX (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          choco install wixtoolset --no-progress -y
          echo "C:\Program Files (x86)\WiX Toolset v3.14\bin" >> $env:GITHUB_PATH

      - name: Build exe installer (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: ./build-native.sh

      # ---------- Linux 需要 fakeroot 生成 deb ----------
      - name: Install fakeroot (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      # ---------- macOS：.dmg / Linux：.deb ----------
      - name: Build native package (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x mvnw build-native.sh
          ./build-native.sh

      - name: List output
        shell: bash
        run: ls -laR target/dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            target/dist/*.dmg
            target/dist/*.deb
            target/dist/*.exe
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -laR dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Simple MC Launcher ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Simple MC Launcher ${{ github.ref_name }}

            极简 MC 启动器 · JavaFX 版

            ### 下载

            | 平台 | 文件 | 安装方式 |
            |------|------|----------|
            | Windows | `SimpleMCLauncher-*-windows.exe` | 双击安装 |
            | macOS | `SimpleMCLauncher-*-macos.dmg` | 打开后拖进 Applications |
            | Linux | `SimpleMCLauncher-*-linux.deb` | `sudo dpkg -i` |

            每个平台**只有一个安装文件**，装好后从菜单/启动台运行，不用管内部目录。
            **已内置 Java 21 运行时，无需另外安装 Java。**

            ### 安装

            - **Windows**：双击 `.exe`，按向导安装
              - 若提示「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」
            - **macOS**：打开 `.dmg`，把启动器拖进 Applications
              - 首次打开若提示「无法验证开发者」，右键点击 → 打开
            - **Linux**：
              ```bash
              sudo dpkg -i SimpleMCLauncher-*-linux.deb
              # 若提示依赖缺失：
              sudo apt-get install -f
              ```
              装好后可在应用菜单里找到，或命令行运行 `SimpleMCLauncher`

            ### 数据目录

            配置和游戏数据都在用户目录下：

            | 平台 | 位置 |
            |------|------|
            | Windows | `%APPDATA%\SimpleMCLauncher\pyLauncher` |
            | macOS | `~/Library/Application Support/SimpleMCLauncher/pyLauncher` |
            | Linux | `~/.local/share/SimpleMCLauncher/pyLauncher` |

            里面对应 `.minecraft/`（版本、模组、存档）、`servers/`、`java/`、
            `launcher_config.json`、`launcher.log`。

            > 便携用法：把程序放在可写目录下运行时，数据会存到程序旁边的
            > `pyLauncher/`，可以连同程序一起拷到 U 盘。

            ### 系统要求

            - Windows 10 / 11（64 位）
            - macOS 11+
            - Linux x86_64（需要 GTK3）

            ### 许可证

            LGPL-2.1
          files: |
            dist/*.dmg
            dist/*.deb
            dist/*.exe
          fail_on_unmatched_files: false
