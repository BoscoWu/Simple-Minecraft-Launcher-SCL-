name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ---------- Windows：单文件 exe（不用安装程序）----------
      - name: Build single exe (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./packaging/build-exe.ps1

      # ---------- macOS / Linux：dmg / deb ----------
      - name: Install fakeroot (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y fakeroot

      - name: Build native package (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x mvnw build-native.sh
          ./build-native.sh

      - name: List output
        shell: bash
        run: ls -laR target/dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: |
            target/dist/SimpleMCLauncher.exe
            target/dist/*.dmg
            target/dist/*.deb
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Rename exe to versioned name
        shell: bash
        run: |
          VER="${GITHUB_REF_NAME#v}"
          if [ -f "dist/SimpleMCLauncher.exe" ]; then
            mv "dist/SimpleMCLauncher.exe" "dist/SimpleMCLauncher-$VER-windows.exe"
          fi
          ls -laR dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Simple MC Launcher ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Simple MC Launcher ${{ github.ref_name }}

            极简 MC 启动器 · JavaFX 版

            ### 下载

            | 平台 | 文件 | 说明 |
            |------|------|------|
            | Windows | `SimpleMCLauncher-*-windows.exe` | **单文件，双击即用** |
            | macOS | `SimpleMCLauncher-*-macos.dmg` | 打开后拖进 Applications |
            | Linux | `SimpleMCLauncher-*-linux.deb` | `sudo dpkg -i` |

            **已内置 Java 21 运行时，无需另外安装 Java。**

            ### Windows（推荐）

            下载 `SimpleMCLauncher-*-windows.exe`，放到任意文件夹，**双击运行**。

            ```
            你的文件夹/
            ├── SimpleMCLauncher.exe     唯一需要的文件
            └── pyLauncher/              首次运行后自动生成
            ```

            - 不需要安装，没有 app / runtime 文件夹
            - 数据（配置、游戏、日志）都在 `pyLauncher` 里
            - 整个文件夹可以拷到 U 盘，程序和数据一起带走
            - 若提示「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」
            - 首次启动需要几秒解压运行时，之后就快了

            ### macOS

            打开 `.dmg`，把 `SimpleMCLauncher` 拖进 Applications。
            首次打开若提示「无法验证开发者」，右键点击 → 打开。

            数据目录：`~/Library/Application Support/SimpleMCLauncher/pyLauncher`

            ### Linux

            ```bash
            sudo dpkg -i SimpleMCLauncher-*-linux.deb
            # 若提示依赖缺失：
            sudo apt-get install -f
            ```

            装好后可在应用菜单找到，或命令行运行 `SimpleMCLauncher`。

            数据目录：`~/.local/share/SimpleMCLauncher/pyLauncher`

            ### pyLauncher 里有什么

            | 文件/目录 | 内容 |
            |-----------|------|
            | `launcher_config.json` | 配置 |
            | `launcher.log` | 日志 |
            | `.minecraft/` | 游戏目录（版本、模组、存档） |
            | `servers/` | 服务端 |
            | `java/` | 下载的 Java |

            ### 本版更新

            - **Windows 改为单文件**：不再是安装程序，也不再解压出
              app / runtime 文件夹，双击 exe 直接用
            - 修复正版登录（微软 OAuth 需要 form-encoded 提交）

            ### 许可证

            LGPL-2.1
          files: |
            dist/*.exe
            dist/*.dmg
            dist/*.deb
          fail_on_unmatched_files: false
