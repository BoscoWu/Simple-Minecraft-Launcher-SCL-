name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build portable package
        shell: bash
        run: |
          chmod +x mvnw build.sh
          ./build.sh

      - name: List output
        shell: bash
        run: ls -laR target/dist || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          # 只上传压缩包，不上传解压后的目录树
          path: |
            target/dist/*.zip
            target/dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -laR dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Simple MC Launcher ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Simple MC Launcher ${{ github.ref_name }}

            极简 MC 启动器 · JavaFX 版 · **便携版**

            ### 下载

            | 平台 | 文件 |
            |------|------|
            | Windows | `SimpleMCLauncher-*-windows.zip` |
            | macOS | `SimpleMCLauncher-*-macos.zip` |
            | Linux | `SimpleMCLauncher-*-linux.tar.gz` |

            ### 使用方法（解压即用，无需安装）

            1. 下载对应平台的压缩包
            2. **完整解压**到一个文件夹（不要直接在压缩包里运行）
            3. 双击 `SimpleMCLauncher.exe`（macOS 是 `SimpleMCLauncher.app`，Linux 是 `bin/SimpleMCLauncher`）

            ### 解压后的目录结构

            ```
            SimpleMCLauncher/
            ├── SimpleMCLauncher.exe   主程序，双击运行
            ├── app/                   程序代码（别删）
            ├── runtime/               内置 Java 21（别删，不用另装 Java）
            └── pyLauncher/            数据目录
                ├── launcher_config.json   配置
                ├── launcher.log           日志
                ├── .minecraft/            游戏目录（版本、模组、存档）
                ├── servers/               服务端
                └── java/                  下载的 Java
            ```

            整个文件夹可以随意移动、复制到 U 盘，不影响使用。

            ### 注意事项

            - **Windows**：若提示「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」
            - **macOS**：首次打开若提示「无法验证开发者」，右键点击 → 打开
            - **Linux**：解压后可能需要 `chmod +x bin/SimpleMCLauncher`
              ```bash
              tar -xzf SimpleMCLauncher-*-linux.tar.gz
              cd SimpleMCLauncher && ./bin/SimpleMCLauncher
              ```

            ### 系统要求

            - Windows 10 / 11（64 位）
            - macOS 11+（Intel / Apple Silicon）
            - Linux x86_64（需要 GTK3）
            - **已内置 Java 21 运行时，无需自行安装 Java**

            ### 许可证

            LGPL-2.1
          files: |
            dist/*.zip
            dist/*.tar.gz
          fail_on_unmatched_files: false
