name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # ---------- Windows：单文件 exe ----------
      - name: Build single exe (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./packaging/build-single-exe.ps1

      - name: Package windows zip
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          $ver = ([xml](Get-Content pom.xml -Raw)).project.version
          $src = "target/dist/SimpleMCLauncher.exe"
          $zip = "target/dist/SimpleMCLauncher-$ver-windows.zip"
          Compress-Archive -Path $src -DestinationPath $zip -Force
          Get-ChildItem target/dist

      # ---------- macOS / Linux：单文件自解压脚本 ----------
      - name: Build single file (macOS/Linux)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          chmod +x mvnw build-singlefile.sh
          ./build-singlefile.sh

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.artifact }}
          path: target/dist/*.zip
          if-no-files-found: error

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Show files
        run: ls -laR dist

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: Simple MC Launcher ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          body: |
            ## Simple MC Launcher ${{ github.ref_name }}

            极简 MC 启动器 · JavaFX 版 · **单文件版**

            ### 下载

            | 平台 | 文件 |
            |------|------|
            | Windows | `SimpleMCLauncher-*-windows.zip` |
            | macOS | `SimpleMCLauncher-*-macos.zip` |
            | Linux | `SimpleMCLauncher-*-linux.zip` |

            ### 使用方法

            **只有一个程序文件，不需要安装，不需要另外装 Java。**

            1. 下载并解压对应平台的压缩包
            2. 双击（或命令行运行）`SimpleMCLauncher`
            3. 首次启动会花几秒解压运行时，之后就快了

            ```
            你选定的文件夹/
            ├── SimpleMCLauncher.exe     <- 唯一需要的文件
            └── pyLauncher/              <- 首次运行后自动生成
            ```

            - **Windows**：双击 `SimpleMCLauncher.exe`
              - 若提示「Windows 已保护你的电脑」，点「更多信息」→「仍要运行」
            - **macOS**：双击 `SimpleMCLauncher`
              - 首次打开若被拦，右键 → 打开；或
                `xattr -d com.apple.quarantine ./SimpleMCLauncher`
            - **Linux**：`chmod +x SimpleMCLauncher && ./SimpleMCLauncher`

            ### 数据目录

            `pyLauncher` 放在程序旁边，是整个启动器的全部数据：

            | 文件/目录 | 内容 |
            |-----------|------|
            | `launcher_config.json` | 配置 |
            | `launcher.log` | 日志 |
            | `.minecraft/` | 游戏目录（版本、模组、存档） |
            | `servers/` | 服务端 |
            | `java/` | 下载的 Java |

            把程序文件和 `pyLauncher` 一起搬走就能继续用，也可以放 U 盘里。

            ### 本版更新

            - **修复正版登录**：微软 OAuth 接口要求 form-encoded 提交，
              之前用了 JSON 导致 `AADSTS900144`，无法登录
            - **改为单文件分发**：不再有 app / runtime 文件夹，
              下载后只有一个程序文件

            ### 系统要求

            - Windows 10 / 11（64 位）
            - macOS 11+
            - Linux x86_64（需要 GTK3）

            ### 许可证

            LGPL-2.1
          files: dist/*.zip
          fail_on_unmatched_files: false
