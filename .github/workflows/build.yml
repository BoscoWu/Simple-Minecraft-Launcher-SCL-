name: Build and Release

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Build with Maven
      run: mvn clean package

    # 这一步自动把打出来的胖包和依赖打包进 jpackage
    - name: Package with jpackage
      run: |
        mvn dependency:copy-dependencies -DoutputDirectory=target/libs
        
        # 获取 jar 包名称
        $jarName = (Get-ChildItem target\*.jar | Where-Object { $_.Name -notmatch 'sources|javadoc' } | Select-Object -First 1).Name
        echo "Jar Name: $jarName"
        
        # 执行 jpackage 打包
        jpackage --type app-image --name SimpleMCL -i target --main-jar $jarName --main-class com.simplemc.launcher.Main --dest target/output --java-options "-Dfile.encoding=UTF-8"
        
        # 压缩为 zip
        Compress-Archive -Path target/output/SimpleMCL -DestinationPath target/SimpleMCL-Windows.zip

    # 自动上传到 Release
    - name: Upload Release Asset
      uses: softprops/action-gh-release@v1
      if: startsWith(github.ref, 'refs/tags/')
      with:
        files: target/SimpleMCL-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}