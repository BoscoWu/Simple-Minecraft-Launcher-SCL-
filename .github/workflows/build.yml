name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Package with jpackage (Windows EXE)
      run: |
        # 1. 创建干净的输入目录
        New-Item -ItemType Directory -Force -Path ./jpackage-input
        
        # 2. 提取依赖包，并过滤掉 original
        $jarName = (Get-ChildItem target\*.jar | Where-Object { $_.Name -notmatch 'sources|javadoc|original-' } | Select-Object -First 1).Name
        Copy-Item "target\$jarName" -Destination "jpackage-input\$jarName"
        
        # 3. 用 jpackage 打包成 .exe 安装程序
        # --win-shortcut 会在桌面生成快捷方式，--win-menu 会加入开始菜单
        jpackage --type exe --name SimpleMCL --app-version 4.0.0 --input jpackage-input --main-jar $jarName --main-class com.simplemc.launcher.Main --dest target/output --java-options "-Dfile.encoding=UTF-8" --win-shortcut --win-menu

    - name: Upload Windows EXE
      uses: softprops/action-gh-release@v1
      with:
        # 自动寻找 target/output 目录下的 .exe 并上传
        files: target/output/*.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}