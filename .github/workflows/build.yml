name: Build and Release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Package with jpackage (Windows EXE, portable)
      shell: pwsh
      run: |
        # 1. 创建干净的输入目录
        New-Item -ItemType Directory -Force -Path ./jpackage-input

        # 2. 取 shade 产物（排除 sources/javadoc/original-）
        $jar = Get-ChildItem target\*.jar |
          Where-Object { $_.Name -notmatch 'sources|javadoc|original-' } |
          Sort-Object Length -Descending |
          Select-Object -First 1
        Copy-Item $jar.FullName -Destination "jpackage-input\$($jar.Name)"

        # 3. 复制 JavaFX 平台 jar（含 native dll），否则运行时报「缺少 JavaFX 运行时组件」
        $jfx = Get-ChildItem "$env:USERPROFILE\.m2\repository\org\openjfx" -Recurse -Filter "javafx-*-win.jar" |
          Where-Object { $_.FullName -match '21\.0\.4' }
        if (-not $jfx) { throw "未找到 JavaFX 平台 jar" }
        $jfx | ForEach-Object { Copy-Item $_.FullName -Destination jpackage-input }
        Write-Host "JavaFX 平台库: $($jfx.Name -join ', ')"

        # 4. 取版本号
        $version = (Select-String -Path pom.xml -Pattern '<version>([\d.]+)</version>' |
          Select-Object -First 1).Matches.Groups[1].Value

        # 5. app-image 免安装版（无需 WiX，产物可直接双击运行）
        jpackage --type app-image --name SimpleMCL --app-version $version `
          --input jpackage-input --main-jar $jar.Name `
          --main-class com.simplemc.launcher.Launcher `
          --dest target/output `
          --java-options "-Dfile.encoding=UTF-8" `
          --win-console

        # 6. 压缩成 zip 便于分发
        Compress-Archive -Path target/output/SimpleMCL/* `
          -DestinationPath "target/SimpleMCL-$version-win64.zip" -Force

        # 7. 生成单文件自解压 exe（双击即可运行，无需解压）
        #    使用 7-Zip 的 SFX 模块：7z.sfx + payload.7z = 单个 exe
        $sevenDir = "C:\Program Files\7-Zip"
        if (-not (Test-Path "$sevenDir\7z.exe")) {
          choco install 7zip -y --no-progress
        }
        $out = "target/SimpleMCL-$version-single.exe"
        Push-Location target/output
        Copy-Item ../../tools/sfx-config.txt . -ErrorAction SilentlyContinue
        Set-Content -Path sfx-config.txt -Encoding UTF8 -Value @"
;!@Install@!UTF-8!
Title="Simple MC Launcher"
RunProgram="SimpleMCL\\SimpleMCL.exe"
GUIMode="2"
;!@InstallEnd@!
"@
        & "$sevenDir\7z.exe" a -t7z -mx=5 "../_payload.7z" "SimpleMCL" "sfx-config.txt"
        if ($LASTEXITCODE -ne 0) { throw "7z 压缩失败" }
        $sfx = [IO.File]::ReadAllBytes("$sevenDir\7z.sfx")
        $payload = [IO.File]::ReadAllBytes((Resolve-Path "../_payload.7z"))
        $fs = [IO.File]::Create((Join-Path (Resolve-Path ../..) "target/SimpleMCL-$version-single.exe"))
        $fs.Write($sfx, 0, $sfx.Length)
        $fs.Write($payload, 0, $payload.Length)
        $fs.Close()
        Pop-Location
        Remove-Item target/_payload.7z -ErrorAction SilentlyContinue

        Write-Host "产物:"
        Get-ChildItem target/*.zip, target/*-single.exe | Select-Object Name, Length

    - name: Upload Portable EXE
      uses: softprops/action-gh-release@v1
      with:
        files: |
          target/SimpleMCL-*win64.zip
          target/SimpleMCL-*-single.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}