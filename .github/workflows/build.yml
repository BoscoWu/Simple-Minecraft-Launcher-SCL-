name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
    
    - name: Build with Maven
      run: mvn clean package -DskipTests

    - name: Package with jpackage (Windows)
      run: |
        $jarName = (Get-ChildItem target\*.jar | Where-Object { $_.Name -notmatch 'sources|javadoc' } | Select-Object -First 1).Name
        echo "Found JAR: $jarName"
        jpackage --type app-image --name SimpleMCL --input target --main-jar $jarName --main-class com.simplemc.launcher.Main --dest target/output --java-options "-Dfile.encoding=UTF-8"
        Compress-Archive -Path target/output/SimpleMCL -DestinationPath target/SimpleMCL-Windows.zip

    - name: Upload Windows Asset
      uses: softprops/action-gh-release@v1
      with:
        files: target/SimpleMCL-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}