name: Build macOS DMG

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build .app
        run: |
          # 注意：这里也是 __main__.py
          pyinstaller --name "SimpleMCLauncher" --windowed --onedir __main__.py

      - name: Create DMG
        run: |
          hdiutil create -volname "SimpleMCLauncher" \
            -srcfolder "dist/SimpleMCLauncher.app" \
            -ov -format UDZO "SimpleMCLauncher.dmg"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: "*.dmg"
