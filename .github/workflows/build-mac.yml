name: Build macOS DMG

on:
  workflow_dispatch: # 允许手动触发

jobs:
  build:
    runs-on: macos-latest # 关键：让 GitHub 提供一台 Mac 来干活
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
          
      - name: Build .app with PyInstaller
        run: |
          # 把 main.py 打包成 .app，--windowed 表示不要终端窗口
          pyinstaller --name "你的启动器名字" --windowed --onedir main.py
          
      - name: Create DMG
        run: |
          # 用 hdiutil 创建 dmg，把你的 .app 塞进去
          hdiutil create -volname "你的启动器名字" -srcfolder "dist/你的启动器名字.app" -ov -format UDZO "你的启动器名字.dmg"
          
      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: macOS-DMG
          path: "*.dmg"
